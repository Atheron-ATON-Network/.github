# Hands the fuzzing machine a fresh copy of the source after every push.
#
# Written to object storage rather than pushed over SSH. The difference is
# which direction the connection goes: the machine now reaches out for the
# source instead of accepting connections, so nothing has to be able to reach
# in and its front door can stay shut to everyone but us.
#
# That machine runs code it has never seen against inputs nobody chose, so it
# should be the hardest thing to reach and should hold the least. What it has
# is read on one bucket. What this job has is write on the same bucket, and
# nothing else.

name: send-to-fuzzing

on:
  workflow_call:
    inputs:
      repo:
        description: Name the fuzzing machine keeps this source under
        required: true
        type: string
    secrets:
      FUZZ_SPACES_KEY:
        required: true
      FUZZ_SPACES_SECRET:
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack the source
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next \
              --exclude=dist --exclude=target \
              -czf /tmp/source.tar.gz .
          echo "packed $(du -h /tmp/source.tar.gz | cut -f1)"

      - name: Send it
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FUZZ_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FUZZ_SPACES_SECRET }}
          AWS_DEFAULT_REGION: tor1
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # The aws cli is already on the runner and speaks to Spaces without
          # anything installed, which is one fewer thing to keep working.
          aws s3 cp /tmp/source.tar.gz "s3://atheron-fuzz-source/source/${REPO}.tar.gz" \
            --endpoint-url https://tor1.digitaloceanspaces.com \
            --only-show-errors
          # Read back rather than trusting the upload. A copy that silently did
          # not arrive would leave the scanner reading week-old code while
          # looking entirely healthy.
          aws s3 ls "s3://atheron-fuzz-source/source/${REPO}.tar.gz" \
            --endpoint-url https://tor1.digitaloceanspaces.com
